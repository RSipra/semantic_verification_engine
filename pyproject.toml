[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harry_potter_trivia"
version = "0.1.0"
description = "A Harry Potter Trivia Game with AI generation and NLP features."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.30.1",   # Current Gemini SDK: runtime (llm_service) + offline pipelines
    "python-dotenv",
    "pyyaml",
    "prefect",
    "pandas",
    "sentence-transformers" 
]

# This tells Python to look for source code in the 'src' folder
[tool.setuptools.packages.find]
where = ["src"]  # Look inside src
include = ["*"]  # Grab everything (e.g. core, notebook_support)

# Pylint: load the Pydantic plugin so model fields are understood (no false E1101 no-member)
[tool.pylint.main]
load-plugins = ["pylint_pydantic"]
source-roots = ["."]
