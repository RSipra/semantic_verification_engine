[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harry_potter_trivia"
version = "0.1.0"
description = "A Harry Potter Trivia Game with AI generation and NLP features."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # DEPRECATED - remove once the offline pipeline is migrated to google-genai
    # (scripts/pipelines/generate_questions/). Kept only for that pipeline.
    # Its protobuf<6 cap blocks the datasets/fsspec/gcsfs security bumps
    # (Dependabot alerts #292, #293).
    "google-generativeai",
    "google-genai",   # Current Gemini SDK: runtime (llm_service, tracer lab)
    "python-dotenv",
    "pyyaml",
    "prefect",
    "pandas",
    "sentence-transformers" 
]

# This tells Python to look for source code in the 'src' folder
[tool.setuptools.packages.find]
where = ["src"]  # Look inside src
include = ["*"]  # Grab everything (ds_utils, HPtrivia_game)